<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Vampeta Almoxarifados</title>
    <style>
        /* Estilos rápidos para manter o padrão do seu projeto */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #192a6b; /* O azul escuro da sua tela de login */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .welcome-container {
            background-color: white;
            color: #333;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #192a6b;
            margin-bottom: 10px;
        }
        .highlight {
            color: #ff9500; /* O laranja do seu botão */
            font-weight: bold;
        }
        .btn-logout {
            margin-top: 20px;
            background-color: #ff9500;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-logout:hover {
            background-color: #e68600;
        }
    </style>
</head>
<body>               

    <div class="welcome-container">
        <h1>Sistema <span class="highlight">Vampeta</span></h1>
        <p>Acesso autorizado com sucesso!</p>
        <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">
        <p>Este é o painel principal do Almoxarifado. Próximo passo: listar as ferramentas e EPIs em estoque.</p>
        
        <button class="btn-logout" onclick="window.location.href='index.html'">Sair do Sistema</button>
    </div>

</body>
